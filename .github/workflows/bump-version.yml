name: BumpVersion

# After CI succeeds on main, commitsmith releases itself with its own reusable
# release action (./release): the version comes from the conventional commits
# since the last tag (breaking → major, feat → minor, fix → patch, docs/test/ci/
# chore alone → no release), the notes from --changelog. It runs the code that
# CI just tested, offline — no model.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    concurrency:
      cancel-in-progress: false
      group: bump-version-${{ github.ref }}
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so the published release triggers publish-npm.yml.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod

      - name: Release
        uses: ./release
        with:
          token: ${{ steps.app-token.outputs.token }}
          cli: node commitsmith.mjs
          setup-node: 'false'
