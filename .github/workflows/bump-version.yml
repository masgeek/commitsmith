name: BumpVersion

# After CI succeeds on main, tag and release with the user's fork of the tag
# action. It reads the commit messages itself — gitmoji-prefixed conventional
# commits, 💥 / `type!:` / `BREAKING CHANGE:` for major, feat → minor, fix and
# other code changes → patch — and skips the release when only docs, tests, CI,
# style or chore commits landed (default_bump: false). No AI involved.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  bump-tag-version:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    concurrency:
      cancel-in-progress: false
      group: bump-version-${{ github.ref }}
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so the published release triggers publish-npm.yml.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Tag and release
        id: tag_version
        uses: masgeek/github-tag-action@release
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          commit_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          tag_prefix: ""
          create_annotated_tag: true
          default_bump: "false"        # nothing releasable (docs/ci/chore only) → no tag
          gitmoji: true                # understand ✨ feat(x): … and 💥 breaking commits
          extended_release_rules: true # also: accessibility/removal → minor; security/refactor/build → patch
          fetch_all_tags: true
          create_release: true         # GitHub Release with the changelog as its body

      - name: Release summary
        if: steps.tag_version.outputs.released == 'true'
        env:
          TAG: ${{ steps.tag_version.outputs.new_tag }}
          BREAKING: ${{ steps.tag_version.outputs.breaking }}
        run: |
          {
            echo "## Release $TAG"
            [ "$BREAKING" = "true" ] && echo "Contains breaking changes."
            echo "Tag and release created by masgeek/github-tag-action."
          } >> "$GITHUB_STEP_SUMMARY"
