name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check (oco-lite.mjs + every src/**/*.mjs module)
        run: pnpm test

      - name: Smoke test (exercises the full module import graph)
        run: node oco-lite.mjs --help

      - name: Verify package.json is valid
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

      - name: Dry-run pack (fails if 'files' list or bin path is broken)
        run: pnpm pack --pack-destination /tmp
