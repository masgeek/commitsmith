name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check
        run: node --check oco-lite.mjs

      - name: Verify package.json is valid
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

      - name: Dry-run pack (fails if 'files' list or bin path is broken)
        run: npm pack --dry-run
