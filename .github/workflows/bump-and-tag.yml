name: BumpVersion
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  bump-tag-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      cancel-in-progress: true
      group: bump-version-${{ github.ref }}
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate Tag
        id: tag_version
        # Pinned to release's HEAD SHA as of 2026-11-17, not the floating
        # `release` branch — that branch has no version tags to pin to
        # instead, and a floating branch ref means the action's behavior
        # could change under us at any time with no changelog.
        uses: masgeek/github-tag-action@d345f4fd4a56b187e807b2f2abab969c55b09a54
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ""
          create_annotated_tag: true

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Version ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          makeLatest: true
          allowUpdates: true
          generateReleaseNotes: true
          skipIfReleaseExists: false
