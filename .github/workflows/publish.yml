name: Publish to npm

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]

# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# One-time setup: publish the first version manually with a token, then
# configure the Trusted Publisher on npmjs.com -> package settings ->
# Trusted Publisher, pointing at this repo + this workflow filename.

permissions:
  contents: read
  id-token: write   # required — this is what lets npm mint the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Syntax check
        run: node --check oco-lite.mjs

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            echo "Run: npm version <patch|minor|major> && git push --follow-tags"
            exit 1
          fi
        if: github.event_name == 'push'

      - name: Publish (Trusted Publishing / OIDC)
        run: npm publish --access public
        # No NODE_AUTH_TOKEN needed — npm CLI v11+ auto-detects the GitHub
        # Actions OIDC context and requests a short-lived token itself.